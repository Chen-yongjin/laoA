[project]
name = "luweik-decision"
version = "1.9.3"
description = "luweik决策系统（Windows 单机版）：A 股匹配 + 盯盘 + 提醒"
authors = [{ name = "async-chen" }]           # 与「关于」对话框、README 的版权信息一致
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",              # 读同花顺全市场 Parquet dump
    "PySide6>=6.6",             # 桌面界面
    "winotify>=1.1; sys_platform=='win32'",   # Windows 原生通知
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # 2026-09-22 起默认用 Nuitka 构建（编译成原生 exe，源码不可被解包还原）；
    # PyInstaller 保留为备用路径（build/laoa_trader.spec + workflow 里那条分支）。
    #
    # ⚠️ **钉在 ==4.2.2，不是 >=**（2026-10-13 排查"1.9.2 双击打不开"得出的口径）：
    #   1.9.1 的包 10-10 08:50 传上去，那时最新版 Nuitka 还是 4.2.2；
    #   Nuitka 4.3 在 10-10 11:13 发布；1.9.2 的包 10-12 12:00 传上去 —— 那次 `pip install -e ".[dev]"`
    #   抓到的是 4.3。**同一份源码、只换了构建器**，正好对上"1.9.1 能开、1.9.2 一进界面就段错误"。
    #   本机旁证：4.3 自带的 SCons 4.10.1 连构建环境都建不起来（`No tool module 'ilink'`），
    #   退回 4.2.2 立刻正常 —— 4.3 这一版本来就容易出岔子。
    #   构建器与编译器一样，属于"发出去的包的一部分"：**要漂移就得是人的决定，不能是 pip 顺手升的**。
    #   （等哪天真要升级 Nuitka：改这一行 → 跑 CI 的 `--gui-selftest` → 人工试装一次再发版。）
    "nuitka==4.2.2",
    "pyinstaller>=6.6",
]

[project.scripts]
luweik-decision = "laoa_trader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 `pytest laoA/tests`（或 `pytest tests`，在 laoA/ 下）无需先 pip install -e 就能 import laoa_trader
pythonpath = ["src"]
# 不改项目目录：不写 .pytest_cache（交付/打包要求目录干净）
addopts = "-p no:cacheprovider"
