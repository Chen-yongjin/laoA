[project]
name = "luweik-decision"
version = "1.6.0"
description = "luweik决策系统（Windows 单机版）：A 股匹配 + 盯盘 + 提醒"
authors = [{ name = "async-chen" }]           # 与「关于」对话框、README 的版权信息一致
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",              # 读同花顺全市场 Parquet dump
    "PySide6>=6.6",             # 桌面界面
    "winotify>=1.1; sys_platform=='win32'",   # Windows 原生通知
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # 2026-09-22 起默认用 Nuitka 构建（编译成原生 exe，源码不可被解包还原）；
    # PyInstaller 保留为备用路径（build/laoa_trader.spec + workflow 里那条分支）。
    "nuitka>=2.4",
    "pyinstaller>=6.6",
]

[project.scripts]
luweik-decision = "laoa_trader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 `pytest laoA/tests`（或 `pytest tests`，在 laoA/ 下）无需先 pip install -e 就能 import laoa_trader
pythonpath = ["src"]
# 不改项目目录：不写 .pytest_cache（交付/打包要求目录干净）
addopts = "-p no:cacheprovider"
