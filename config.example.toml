# 老牛选股助手（Windows 单机版）配置文件示例
#
# 用法：把本文件复制成 config.toml 放在程序（或 exe）同级目录，然后按需修改。
#   copy config.example.toml config.toml
#
# 优先级：环境变量 > config.toml > 内置默认值。
# 也就是说，同名的环境变量（如 HITHINK_FINANCE_API_KEY）会覆盖这里的值 ——
# 不想把 Key 写进磁盘文件时，用环境变量即可。

# ── 数据源 ─────────────────────────────────────────────────────────
# 同花顺金融数据服务 API Key（https://fuyao.aicubes.cn/admin 获取）。
# 填法有三条，等价：
#   1) 在界面上填：**系统设置 → 数据来源 → 同花顺那一行的 Key 输入框**（点【保存设置】即生效，
#      不用重启；那一行还有【测试连接】可以先验一下）。程序**不预置任何 Key**，出厂是空的。
#   2) 写在这个文件里（就是下面这一行）；
#   3) 用环境变量 HITHINK_FINANCE_API_KEY 覆盖（不想把 Key 落盘时用这条）。
# 留空会发生什么（如实说）：行情与「大盘概览」照常（走免 Key 的公开源兜底），
#   但**完整历史下载与选股用不了** —— 数据自检要求「复权事件」与「行业归属」齐备，
#   这两样只有同花顺那条路给得到（缺了它就会拿算错的复权价去选票，所以自检会拦住）。
hithink_api_key = ""

# 行情数据来源：**列表本身就是启停，顺序就是优先级**（前一个取不到才轮到后一个）。
# 可填的 id（认不出的会被忽略并在日志里说明，不会让程序起不来）：
#   "public"     **公开行情源（腾讯为主 + 新浪兜底）—— 免 Key，兜底源**。
#                没配同花顺 Key（或 Key 失效）时靠它：两张表的现价/涨幅/市值/换手、
#                大盘概览、以及把当天的行情与涨停池写进库。
#                实测（2026-09-17）：腾讯批量接口一次 100 只、全市场 5562 只约 0.7 分钟；
#                字段含 现价/涨跌幅/成交量额/换手率/流通市值/总市值/市盈率/市净率/
#                量比/均价/涨跌停价/五档。缺的票自动用新浪兜底（新浪单位是股与元，
#                腾讯是手与万元，程序内部已统一）。
#                ⚠️ 它们是**公开但未授权**的行情接口：可能改字段或限流（实测 2026-09-18：
#                腾讯 fqkline 抓全市场到 700 只左右开始连续失败、新浪列表接口回 HTTP 456），
#                所以它只当**兜底**，主源是同花顺（有 Key 时先走它）。数据为准实时快照，
#                非交易所授权行情。
#   "hithink"    同花顺金融数据服务（要 Key，就是上面的 hithink_api_key）。
#                **主源**（出厂就排在第一位）：一次请求能拿全市场 10 年
#                历史 dump + 竞价 + 估值 + 涨停池，是最稳的一路；
#                能力：全市场日线（dump）、实时快照、涨停/跌停/炸板池、复权因子、
#                交易日历、板块与成分股。
#   "eastmoney"  东方财富公开接口。**免 Key**，不用申请就能用；没填同花顺 Key 时
#                靠它也能在「自选股池」「持仓监控」两张表里显示现价/涨幅。
#                能力：实时快照、历史日K（日线）、全市场代码表（代码+名称）。
#                ⚠️ 已知风险（如实写在明面上）：这是**公开但未文档化**的接口，
#                官方可能改字段或限流；它**没有**实时涨停池/复权因子/交易日历，
#                代码表也**拿不到行业**。实测（2026-09-16）：全市场快照 5559 只、
#                日K 与批量快照都能取到，成交量单位是「手」（程序内部已换算成股）。
# 出厂设置（**同花顺优先**；没配 Key 时它会自动跳过、落到公开源兜底）：
#   data_sources = ["hithink", "public"]     # 有 Key：同花顺优先
#   data_sources = ["public"]                # 完全不要同花顺（纯免 Key：只能看行情与概览）
#   data_sources = ["public", "eastmoney"]   # 公开源 + 东财兜底
# 说明：**没有** `xxx_enabled` 这类开关 —— 一个键只表达一件事，
# 不会出现"列表里有、开关却是关"这种自相矛盾的状态；界面上勾选/取消就是在改这一行。
# 环境变量：DATA_SOURCES="public,hithink"（逗号分隔，与 notify_channels 写法一致）。
data_sources = ["hithink", "public"]

# 本地数据目录。默认 %LOCALAPPDATA%\LaoATrader\data（Windows）。
# 数据库 trader.db、dump 缓存都在这里；数据约 1~2 GB，建议放在 SSD 上。
# data_dir = "D:\\LaoATrader\\data"

# ── 策略组（跑哪几组策略）──────────────────────────────────────────
# 按"持有期 + 证据强度"分三组，**默认只开 short**（用户拍板后的默认策略集）：
#   ultra  超短·隔日  T+2   连板回踩低吸             ⛔ 默认停用（见下）
#   short  短线·T+3   T+3   短期反转/地量后放量变盘/首板缩量整理   t≈1.7~2.1  ← 默认开
#   swing  波段·T+10  T+10  低价股                   ⛔ 默认停用（见下）
#
# 为什么停用那两组（成绩单实跑结论，代码都还在，想自己开就加回来）：
#   * ultra（连板回踩低吸）：两套口径显著为负 —— B 口径 −1.21%(t=−5.36)、
#     T+10 −4.24%(t=−8.87)，6 年 0 年为正；
#   * swing（低价股）：T+10 波段，与本版「最多持有到 T+3」的定位不符。
enabled_groups = ["short"]

# 只跑列出的策略（中文名或类名都认）；**留空 = 该组全选**。
# 与 enabled_groups 同时非空时取交集；两者都空 = 全选。
# enabled_strategies = ["低价股", "连板回踩低吸"]
enabled_strategies = []

# ── 自定义公式（界面上是「公式选股」页）────────────────────────────
# 参与选股的公式名（**就是文件名去掉 .txt**；公式文件放在 exe 同级的 formulas 目录）。
# 「公式」是一个与 ultra/short/swing 并列的组，但成员由你在界面上勾 ——
# 所以默认是空的（看过示例公式也不会改变内置策略的结果）。
# 在界面「公式选股」页勾上「参与选股」会自动写回这一行，一般不用手改。
#   名字写错（文件删了/改名了）或公式语法有错的条目会被**忽略并记日志**，
#   既不会让整轮选股失败，也不会影响其它公式与内置策略。
# enabled_formulas = ["放量上攻", "涨停回踩低吸"]
enabled_formulas = []

# 推送范围：**默认 false = 启用的策略都推送**（不替用户过滤）。
# short 组里有两条策略（地量后放量变盘、首板缩量整理）的正 α **只存在于"开盘买"口径**：
#   A 开盘买 +0.09%(t=2.31) / +0.21%(t=1.92)；换成尾盘买转负 −0.15%(t=−3.14) / −0.01%(t=−2.34)
# 要不要为这个放弃它们由你判断 —— 程序只把数字摆在眼前：设置页的策略勾选框旁边就写着
# 这几组数，池子表格/卡片上带「（依赖开盘）」标记（提示，不是过滤）。
# 改成 true = 只推"两套口径都为正"的标的（被跳过的仍进池、仍显示，且会在推送正文/
# 日志/状态栏里说明原因）。
push_only_proven = false

# ── 自选股（手动加的标的：与策略标的并列进池、一起盯）────────────────
# 怎么加：界面「自选股」页，或命令行
#   python -m laoa_trader --cli --watchlist add 600519 --note 龙头
#   python -m laoa_trader --cli --watchlist list
#   python -m laoa_trader --cli --watchlist enable|disable|remove 600519
#
# 规则：
#   * **不受热门行业过滤**（自己选的，就是要盯）；
#   * **不占策略名额**（下面的池子大小只作用于策略标的）；
#   * 同一标的既是策略选中又是自选 → 池子里只出现一行，来源标成「策略+自选」；
#   * 名称在添加时自动从本地库补（查不到也允许加，只是提示一下）。
watchlist_max = 20        # 自选股上限；超出的会提示（不静默丢弃）

# 关掉 = 只记录不监控：自选股不进池、盘中也不提醒（列表里仍然保留）
watchlist_in_pool = true

# ── 通知方式（频道自选；**默认空 = 只走下面的 QQ 式浮窗**）──────────────
# 可选频道：windows（Windows 原生弹窗）/ feishu（飞书卡片）/ tray（托盘气泡）
# **出厂默认一条都不勾**（用户拍板）：提醒默认只走"图标闪烁 + 消息列表"
# （托盘/任务栏图标闪，点托盘图标打开「消息」窗口看列表；飞书那一套照旧能勾），
# 系统弹窗/托盘气泡/飞书由你自己勾上 —— 第一次跑就被系统窗口打断不是这个程序该干的事。
# 想开哪路就把名字写进列表，例如：notify_channels = ["feishu", "tray"]
# （Windows 系统通知那一整路已于 2026-09-18 按用户要求删除）
notify_channels = []

# Windows 弹窗参数

# 托盘气泡显示时长（毫秒）
notify_tray_duration_ms = 8000

# ── 提醒浮窗（右下角自己滑出来的那扇窗）────────────────────────────
# 默认**关**（用户 2026-09-18 拍板）：他要的是 QQ 那种 —— 图标闪一下，你自己点开
# 看消息列表（点托盘图标即开；盘中提醒与"选股完成"都在里面，未读带圆点）。
# 想让它自己蹦出来看，就把下面这行改成 true（勾上之后与消息列表同时存在，互不影响）。
# 为什么不用 Windows 系统通知：系统弹窗的**点击行为不受本程序控制**（点不开、
# 看不到内容，在"专注助手 / 勿扰"打开时干脆不显示），所以提醒是自己画窗口。
notify_popup = false
notify_popup_seconds = 8         # 浮窗几秒后自动消失（鼠标停在上面时不消失）
notify_popup_max_items = 5       # 浮窗最多列几条（1~10），点任意一条看详情
notify_sound = true              # 提醒时响一声系统提示音（winsound，仅 Windows 有效）
notify_flash_seconds = 6         # 托盘/任务栏图标闪烁几秒（0 = 不闪）
# 桌宠（用户 2026-09-18 要的）：常驻桌面、置顶、不进任务栏的小卡片；
# 有消息时冒气泡 + 蹦两下，双击它打开消息列表，右键有【消息】【试喊一条】
# 【静音一小时】【藏起来】。拖动它会被记住位置（pet_x / pet_y）。
notify_pet = true
pet_x = 0                        # 0 = 还没拖过 → 默认放屏幕右下角
pet_y = 0
# 中文语音朗读：用 Windows 自带的语音合成（不联网、不用装东西）。
# 这台机器没有中文音色时**自动不念**（英文音色念中文是怪腔怪调），其余提醒照常。
notify_voice = true
notify_voice_volume = 0.9        # 0~1，用户要求「大声喊」，默认 90%
notify_voice_rate = 0            # -10（慢）~ 10（快），0 = 正常

# 飞书频道：自建应用的 App ID / App Secret / 目标会话 ID。
# 没配凭证时：勾了飞书也只会提示「未配置飞书凭证，已跳过」，不影响其它频道。
feishu_on = true
feishu_app_id = ""
feishu_app_secret = ""
feishu_chat_id = ""
# 目标类型：chat_id（群）| open_id | email | user_id | union_id
receive_id_type = "chat_id"

# 单频道开关（老配置沿用；与 notify_channels 同时生效，任一为 false 就不发）
notify_feishu = true
notify_tray = true

# ── 交易参数（只用于生成条件单文本，本程序不含任何下单功能）─────────
trade_capital = 100000.0     # 账户可用资金（元），仅用于算整手数量
trade_position_pct = 0.2     # 单票最大仓位占比
trade_max_positions = 5      # 最多同时持有只数（超过只提示不加仓）
buy_slippage = 0.005         # 买入委托价相对触发价的上浮（留滑点，避免挂不上）
sell_slippage = 0.005        # 卖出委托价相对触发价的下降

# ── 盘中提醒 ───────────────────────────────────────────────────────
intraday_interval = 60       # 交易时段内的轮询间隔（秒）；异动提醒也共用这一轮，不另外加定时器

# 集合竞价**全市场扫描**（9:15–9:25 的**真实买卖盘**）：**默认关**（口径与阈值待确认）。
# 竞价是当天第一份真实供求 —— 谁高开放量、谁低开走弱，比盘中任何指标都早。
# 做法是"**扫全市场（约 5600 只）再按下面的规则过滤**"，不是只看自己的池子：
#   intraday_auction = false 关掉后：一次请求都不发、卡片上不显示竞价行、不推竞价提醒
intraday_auction = false

# 扫描时刻（HH:MM，逗号分隔）：默认 09:20 与 09:25 —— 9:25 那次拿到的是**竞价终态**。
# 为什么不每分钟扫：全市场 5573 只按 100 只一批 = 56 个请求，9:15–9:25 每分钟一轮
# 就是 560 个请求，配额会被打光、也容易触发限流。一次扫描约 20~30 秒
# （批间 ≥0.3 秒、串行），跑在后台线程里，界面不会卡。
auction_scan_at = ["09:20", "09:25"]

# 过滤规则（界面上「设置 → 竞价扫描」那一组改的就是这几个）：
# ① 涨幅区间：低于下限的不看；**≥ 上限的直接丢掉** —— 一字板/接近涨停买不进，推了也没意义
#    （实测某日 25 只后期涨停里没有一只竞价涨幅 ≥9%，所以这条上限几乎零成本）
auction_min_pct = 2.0
auction_max_pct = 9.0
# ② 板块多选：main 主板 / chinext 创业板(300,301) / star 科创板(688,689) /
#    bj 北交所(43x/83x/87x/88x/92x，按 .BJ 后缀判定最稳)。
#    只勾科创 + 创业板 = "只看双创"；**一个都不勾 = 不限制（等于全选）**
auction_boards = ["main", "chinext", "star", "bj"]
# ③ 成交额下限（元）：**不到就不参与**。竞价量太小时"未匹配量 ÷ 成交量"会爆表
#    （实测某小盘股 +29.46），拿它判断强弱等于把噪音当信号。
#    默认 500 万 —— 全市场只有 8.7% 的股票过这条线，嫌严可以调到 300 万。
auction_min_amount = 5000000.0
# ④ 打分（判强/弱）的门限，口径是**分级给分**（不是"多个条件同时满足"——实测那种 AND
#    组合在 100 只里是 0 只）：
#      涨幅 >= auction_min_pct（默认 +2.0%）→ +2；达到它一半（+1.0%）→ +1
#      量比 >= auction_min_volume_ratio（默认 2.0）→ +2；达到它 75%（1.5）→ +1
#      未匹配比 >= +0.5（买盘剩余占优）→ +1；<= -0.5（卖盘剩余占优）→ -1
#      成交额 >= auction_min_amount（上面那条）→ +1
#      低开（涨幅 <= -门槛）→ -2；略低开（<= -门槛/2）→ -1
#    默认 2 分算命中：真实全市场数据下"覆盖当日后期涨停 24% vs 20%、推送量 0.44 vs
#    0.29 条/天"—— 2 分更划算（多推一点、多覆盖一截）。写 6 = 满分才推。
auction_min_volume_ratio = 2.0
auction_min_score = 2
# ⑤ 一次扫描最多推几只（按分数排序取前 N，**1~50**）；详情弹窗里能看到全部命中
auction_alert_max_items = 10
# 接口只给一个带符号的未匹配量：>0 买盘剩余、<0 卖盘剩余，**-1 当"缺失"**
# （茅台就是 -1）。竞价换手率与相对昨日量比会一起显示在推送里。

# 当日个股异动（涨停/跌停/大幅上涨下跌/快速反弹跳水）实时提醒：**默认关**。
# 为什么关（用户拍板）：能力本身没问题（全市场一条请求 + 本地按"池子/自选/持仓"过滤，
# 不逐只去问），但**消息太多** —— 手里的票一天能触发好几条多是"无用消息"，
# 把真正要看的提醒淹掉。想看就改成 true。
# 同一只票同一天同一标签只推一次（不刷屏）。
intraday_anomaly = false
# 只关心这些异动标签（空 = 全部）。取值：
#   LIMIT_UP 涨停 / LIMIT_DOWN 跌停 / SHARP_RISE 大幅上涨 / SHARP_FALL 大幅下跌 /
#   RAPID_RALLY 快速反弹 / RAPID_DECLINE 快速下跌
anomaly_alert_tags = []

# ── 持仓做T 的**近似**提示（只对自己持仓的票；**默认关**）─────────────────
# A 股 **T+1**：当天买的当天不能卖，所以一个持仓股一天只能做两件事 ——
#   反T（先卖后买）：卖掉**部分昨仓** → 当天更低时买回等量 → 成本降低、收盘股数不变；
#   正T（先买后卖）：用**可用现金**低吸   → 当天反弹后卖出**等量昨仓** → 收盘股数不变。
# 提示一律按这两种说法写、一律带「部分」：程序不知道你今天又买过多少（那部分不能卖）、
# 也不知道有多少股被挂单冻结 —— **能卖多少只有券商的持仓页说了算**（提示里也就这么写着）。
#
# ⚠️ 这些提示是**近似**的，而且**无法回测**：只有每 60 秒一张的行情快照，
#    没有分时/逐笔/Level-2 数据，也没有历史分时数据来验证阈值 ——
#    下面四个数字是**手工设定的起点**（不是拟合、也不是验证过的结果），请当成"先这么用、自己再调"。
#    提示只对**持仓**（position 表里 quantity > 0）发，**不参与选股、也不进当天池子的推送**。
# **默认关**（用户拍板：T策略默认关）：阈值既然没验证过，就别默认拿去打扰人 ——
# 想用就把它改成 true（或设环境变量 INTRADAY_T=1）。
intraday_t = false
# 高抛（反T 前半段）：现价相对**昨收**涨 ≥ t_high_min_gain_pct，
# 且从**今日最高**回落 ≥ t_high_pullback_pct，且现价仍在分时均价上方（回落但没破位）
# → 提示"可卖出部分昨仓，回落再接回"。
t_high_min_gain_pct = 2.0
t_high_pullback_pct = 1.5
# 低吸（正T，或反T 卖掉之后的接回）：现价相对**昨收**跌 ≥ t_low_min_drop_pct，
# 且从**今日最低**反弹 ≥ t_low_rebound_pct，且未跌破（或**刚收回**，容差 0.5%）分时均价
# → 提示"可用现金低吸，反弹后同日卖出等量昨仓"。
t_low_min_drop_pct = 2.0
t_low_rebound_pct = 1.0
# 分时均价没有现成字段，是**累计成交额 ÷ 累计成交量**算出来的（接口只给
# last/open/high/low/prev/volume/turnover）。算出来的均价若不在当日 [最低, 最高] 内
# （例如成交量单位其实不是"股"），那一条提示**整条不发** —— 宁可不说，也不给一个错的数。
# 一天最多各推一条（与其它盘中提醒同一套去重：同标的同类型当天只推一次）；
# 持仓页第 8 列「今日T提示」显示今天的最新一条，鼠标停上去有完整那句。
# 关掉/打开：intraday_t = false / true（或环境变量 INTRADAY_T=0 / 1）。四个阈值也有环境变量：
# T_HIGH_MIN_GAIN_PCT / T_HIGH_PULLBACK_PCT / T_LOW_MIN_DROP_PCT / T_LOW_REBOUND_PCT。
stop_loss = 0.05             # 止损比例（相对成本价）
take_profit = 0.10           # 止盈比例（相对成本价）

# ── 自动运行（**默认 false = 不做定时运行**）──────────────────────────
# 用户拍板：**选股随时手动，不设定时运行** —— 出厂状态下程序**不会有一天自己跑起来**，
# 数据增量、选股、建池、推送都要你点一下（或命令行 --once）。
# 想让程序每天自动跑一遍就把 auto_run 改成 true；两个时间键一直有效。
#
# 主跑时间：每天跑一次"数据增量 + 策略 + 建池 + 推送"（24 小时制 HH:MM，本地时间）。
# 默认 16:00 —— A 股 15:00 收盘，收盘后当天行情与涨停池才齐（早于 15:00 会提示你）。
run_at = "16:00"

# 补跑时间：**主跑没成功时**到这个点再试一次（留空则不做补跑）。
# 必须晚于主跑时间，否则保存会被拒绝。
run_at_fallback = "19:15"

# 是否每天自动运行：true 才跑；false 只在【立即选股并建池】（或命令行 --once）时跑。
auto_run = false

# ── 界面偏好（只影响"怎么显示"，不影响选股与任何计算）──────────────
# 股票池默认视图：
#   cards  卡片（默认）—— 每只股票一张卡，来源/行业/备注/条件单参数都看得全；
#   table  9 列表格    —— 一行一只，池子大时更密（表格里也能点【复制条件单】）。
# 股票池页右上角的【切换为卡片/表格】按钮可随时改，改完会写回本文件（下次启动沿用）。
pool_view = "cards"

# 界面主题（皮肤）：
#   silver  银色金属感（默认）—— 浅银灰底 + 细边框 + 轻微渐变，按钮是金属质感；
#   system  系统默认           —— 回到 Windows 原生外观（不喜欢皮肤时切这个）。
# 设置页最上面的「界面主题」下拉框可随时改，**改完立即生效**（不用重启），
# 选择会写回本文件；也可以用环境变量临时覆盖：UI_THEME=system。
# 写错（例如 "Silver"/"银色"/少个字母）就按默认 silver 处理，不会让界面起不来。
ui_theme = "silver"

# ── 大盘概览（**第一个页签**，启动就停在这一页）──────────────────────
# 整页自上而下（命令行 `python -m laoa_trader --cli --market` 打印的是同一份）：
#   涨停 55 · 跌停 16 · 炸板 30 ｜ 沪 7792亿 · 深 8499亿 · 北 140亿
#   上涨 3126 · 下跌 2224 · 平盘 221
#   宽基：上证 3885.33 -0.07% ｜ 深成 13384.57 -0.64% ｜ 创业板 3285.58 -1.10% ｜ …
#   情绪：同花顺情绪 885.53 -0.18% ｜ 昨日连板 6928.17 +3.53% ｜ 昨日打首板 1551.88 +1.69% ｜ 微盘股 2131.00 +0.95%
#   板块：银行 1408.77 +0.88% ｜ 证券 1428.64 -0.27%
#   数据来源：同花顺金融数据服务 · 更新于 2026-09-14 15:03（每分钟自动刷新）
# 刷新节奏：这一页**自己每分钟刷一次**（启动后立刻先刷一次；只在它可见、且窗口没最小化时
#           才刷；切到这一页时如果缓存过期会立刻刷一次），取数另有 55 秒 TTL 兜底。
#           取数在**后台线程**里跑（主线程只管画界面：启动时数据自检也在跑）。
# 口径（都走同花顺接口，成功判据是信封 code == 0）：
#   * 涨跌停家数：涨停/跌停/炸板池，size=1 只取 pagination.total（不拉明细）；
#   * 沪/深成交额：直接取 上证指数(000001.SH) 与 深证成指(399001.SZ) 的成交额；
#   * 三组指数都走 `a-share-index/prices/snapshot`（**必须传代码**），一次批量取回；
#   * 涨跌家数与北交所成交额：全市场快照分页汇总（约 5571 只 / 6 页），见 market_breadth；
#   * 取不到的那一段显示 “—”，鼠标停在页面上有原因（未配 Key / 限流 / 代码不存在等）；
#   * 某一组**整组配空**（=[]）时，那一行**整行不显示**（不会留一个空的“板块：”）。
#
# 总开关：关掉则概览一个请求都不发（页面只剩 “—” 和原因）。
market_overview = true

# 宽基指数（同花顺代码，逗号分隔或写成数组都行，顺序 = 显示顺序）。
# 想换显示名就在后面加 `=名称`，例如 "000001.SH=我的上证"；表里没有的代码就显示代码本身。
# 名称表在源码 src/laoa_trader/market.py 的 INDEX_NAMES（本地小表，不每次去拉目录）。
# ⚠️ 899050.BJ（北证50）**不存在**：接口对一个非法代码会整批报错，
#    程序会自动逐只重试、只跳过它（其余照常显示），但最好别往这里写不存在的代码。
market_indices = ["000001.SH", "399001.SZ", "399006.SZ", "000688.SH", "000300.SH"]

# 市场情绪指数 —— **这几个是给你自己换的**（同一个端点，换个代码就换一套心情指标）。
# 默认：883404.TI 同花顺情绪指数 / 883958.TI 昨日连板 /
#       883994.TI 昨日打首板表现 / 883418.TI 微盘股。
# 想换成自己的口径，改上面这一行即可（名称可用 `代码=显示名` 自定义）。
# 其它可选（都在同一端点、实测都能取到）：
#   883900.TI 昨日涨停表现        883409.TI 近期强势
#   883918.TI 昨日炸板股          883408.TI 近期新高
#   883911.TI 创历史新高          883423.TI 沪深主板昨日涨停
#   883424.TI 创业科创板昨日涨停   883422.TI 北交所昨日涨停表现
# 例：market_sentiment_indices = ["883958.TI", "883409.TI"]
market_sentiment_indices = ["883404.TI", "883958.TI", "883994.TI", "883418.TI"]

# 板块指数（同花顺一级行业指数，目录 tag=industry；同样支持 `代码=名称`）。
# 默认银行 / 证券；想盯别的行业就换成对应的 881xxx.TI，整组配空则这一行不显示。
market_sector_indices = ["881155.TI", "881157.TI"]

# 全市场快照汇总（页面上第二行的涨跌家数 + 摘要里的北交所成交额）：**默认开**。
# 代价是要翻 6 页全市场快照（约 5571 只 / 每页 1000，页间间隔 ≥0.3 秒），
# 所以它有**自己独立的 5 分钟缓存**（页面上也写着"每 5 分钟更新"），
# 不会跟着这一页每分钟的刷新去重翻页。关掉 = 这两项显示 “—” 且一个分页请求都不发。
market_breadth = true

# 概览的缓存时长（秒）：页面每分钟刷一次、切页时也会刷，但**到点才真的打接口**
# （55 秒特意略小于 60 秒，避免"每分钟刷一次却总差一点没到点"的边界抖动）。
# 写 0/负数会按默认 55 处理。
market_overview_ttl = 55

# ── 大文件下载（dump 有几百 MB：断点续传 + 链接过期自动重签）──────────
# 下载链接（同花顺预签名 URL）只允许 GET、有效期约 5 分钟，所以程序是
# "分块下载 + 从 .part 断点续传 + 每次重试重新签 URL"。网络不稳时调大下面两个超时。
download_max_attempts = 5        # 失败后的最大尝试次数（每次都会重新签 URL、从断点继续）
download_connect_timeout = 15.0  # 建连超时（秒）：网络差就赶紧重试
download_read_timeout = 90.0     # 读取超时（秒）：两个数据块之间的最大间隔，流式下载留足余量

# ── 导入多少年历史（首次下载时用）──────────────────────────────────
# 同花顺 daily-k dump 固定就是 10 年，**没法只下 6 个月**（端点没有这个选项）；
# 这里的做法是：照常下载整个 dump，但**只把最近 history_years 年的行情导入本地库**。
#   * 默认 **0.5 年 = 6 个月**（用户拍板：超短线不需要长历史）：约 120 个交易日、
#     全市场约 50 万行 —— 分发给别人时库更小、首次导入更快（**下载量不变**）；
#   * 想要长样本（成绩单/逐年稳定性更可信）：改成 10，下载文件一样、只是导入更多行；
#     ⚠️ 成绩单的门槛是 250 个交易日，6 个月的库跑 `--scorecard` 必然显示"样本不足"；
#   * 复权事件（分红/送股/配股，5.7 万条）**永远全部保留** ——
#     否则窗口起点之前的除权算不进去，整段后复权价会差一个常数。
history_years = 0.5

# ── 启动自检（判定本地数据是否可用；纯本地、不联网、秒级）──
# 三态：ready（不下载） / needs_incremental（落后 ≤10 个交易日，只下增量） / needs_full（重新下载并导入）
auto_download_on_start = true    # needs_incremental 时是否自动在后台跑增量；needs_full 始终需要你确认（或 CLI 加 --auto-download）
min_history_years = 0.4          # 历史跨度低于此值算"缺数据"（**必须 < history_years**：6 个月导入后实际跨度会略小于 0.5，留 0.1 年余量）
min_symbols = 4000               # 股票数低于此值算"缺数据"（全市场约 5200）
max_stale_trading_days = 0       # 允许落后的交易日数（0=必须是最新）；落后 >10 个交易日一律判 needs_full

# 自选股相关开关见上面「自选股（手动加的标的：与策略标的并列进池、一起盯）」一节
