# 在 GitHub 的 Windows 运行器上自动打包「老牛选股」
#
# 用法（你本机不需要装 Python）：
#   1. 代码推到 main 后会自动构建；也可以在 Actions 页面点 "Run workflow" 手动触发
#   2. 构建完成后，**优先去 Release 页面下载**（固定链接，不受 artifact 额度影响）：
#      https://github.com/Chen-yongjin/laoA/releases/tag/latest
#      直链：https://github.com/Chen-yongjin/laoA/releases/download/latest/LaoniuTrader.zip
#   3. 解压后双击 老牛选股.exe 即可（首次运行会走数据自检 → 下载向导）
#   注：该次运行页面底部的 Artifacts 里也有一份（LaoniuTrader），但 artifact 有额度限制，
#       额度满了那一步会失败 —— 所以 Release 才是主下载通道（见下面 step_release）。
#   注册机（作者专用）也在**同一个 Release 页面**的 Assets 里：``keygen.exe``。
#
# 说明：
# - 测试不过就不出包（pytest 失败即整轮失败），避免把坏版本发出去
# - 产物是 onedir 目录版（启动快、杀软误报少），压缩后通常 200~400MB
# - 构建失败时会额外上传 pytest-log 产物（里面是完整测试输出），报错时先看它
# - action 版本已升到 v7（Node 24 运行时），不会再出现 Node.js 20 deprecated 告警
name: build-windows

on:
  workflow_dispatch:          # 手动触发（推荐：想发包时点一下）
    inputs:
      skip_tests:
        description: "跳过测试直接打包（仅在 CI 平台问题未解决时用）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:             # 只改文档就不必跑构建，省额度
      - "docs/**"
      - "**.md"

permissions:
  contents: write   # 失败时把 pytest.log 推回 ci-log 分支，便于本地直接 git fetch 查看

# 同一分支只留最新一次构建：连续推几次时，旧的那次直接取消 ——
# Windows 运行器很贵（额度按 2 倍算），排在后面的构建跑完也没人看。
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"                       # Windows 上避免中文路径/日志乱码
      # 崩了要能看到"是哪条线程/哪一行崩的"：`Fatal Python error: Aborted` 这类中止
      # 默认只给一段 C 栈，打开 faulthandler 会连 Python 侧的线程栈一起打出来
      # （2026-09-20 那次"偶发中止"就是靠它才定位到"孤儿桌宠"的）。
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - id: test
        name: 跑测试（不通过就不出包）
        # 本机约 5 分钟，Windows runner 实测约 20 分钟（慢约 3~4 倍），上限必须留足：
        # 2026-09-21 那轮就是「1622 条测试全过、却因为这一步撞上 20 分钟上限」被判失败。
        timeout-minutes: 40
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        shell: pwsh
        run: |
          # ⚠️ 这里**不用** `Tee-Object` 管道：2026-09-21 那次"跑到 89~93% 就没声音了"
          # 的排查中，管道的缓冲把中止前最后那段（faulthandler 的线程栈）吞掉了 ——
          # 直接重定向到两个文件最可靠：stdout 是 pytest 的进度与失败摘要，
          # stderr 里才有 `Thread 0x… (most recent call first)` 这样的**线程栈**。
          # `-p no:cacheprovider` 与本地一致；`--tb=short` 便于失败摘要读取。
          $env:PYTHONFAULTHANDLER = "1"
          # `faulthandler` 的"卡住 N 秒就 dump 所有线程栈"兜底：正常跑完不会触发
          # ⚠️ 用 `-o faulthandler_timeout=`（ini 形式）而不是 `--faulthandler-timeout=`：
          # 2026-09-21 实测后者会被当成未知参数、pytest 直接报错退出（CI 因为这条红过一次，
          # 测试压根没跑起来）。它的作用是"某条用例卡住超过 N 秒就把所有线程栈 dump 出来"。
          python -m pytest tests -q --tb=short -p no:cacheprovider -o faulthandler_timeout=900 > pytest.log 2> pytest-err.log
          $code = $LASTEXITCODE
          Get-Content pytest.log | Select-Object -Last 3
          if (Test-Path pytest-err.log) {
            $errLines = (Get-Content pytest-err.log).Count
            Write-Host "stderr 行数：$errLines（线程栈/日志报错都在这里）"
            Get-Content pytest-err.log | Select-Object -Last 30
          }
          if ($code -ne 0) {
            Write-Host "::error::测试未通过，详见 pytest.log / pytest-err.log 产物"
            exit 1
          }

      - name: 失败摘要（直接变成 GitHub 注解，便于复制定位）
        if: failure() && hashFiles('pytest.log') != ''
        shell: pwsh
        run: |
          # 把每条失败用例 + 紧随其后的错误行，输出成 ::error:: 注解
          # 这样在 Actions 页面的 "Annotations" 区域就能看到，不必下载产物
          $lines = Get-Content pytest.log
          $buf = @()
          foreach ($l in $lines) {
            if ($l -match '^FAILED ') { $buf += $l }
            elseif ($l -match '^E\s+' -and $buf.Count -gt 0 -and $buf[-1] -notmatch '^\s*E') { $buf[-1] = "$($buf[-1]) || $($l.Trim())" }
          }
          foreach ($b in $buf | Select-Object -First 20) { Write-Host "::error::$b" }
          $summary = ($lines | Where-Object { $_ -match 'passed|failed|error' } | Select-Object -Last 1)
          Write-Host "::error::测试汇总：$summary"

      - name: 失败时上传测试日志（**含 stderr**）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log
          # 两个都传：pytest 的进度/摘要在 pytest.log，而**线程栈只在 stderr**
          # （上次那种"跑到半路中止、没有失败记录"必须靠它才能定位）
          path: |
            pytest.log
            pytest-err.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时用固定顺序再跑一遍（便于本地复现，不参与判定）
        # 随机顺序下崩在"某条用例留下的线程/窗口"上时，固定顺序往往能说清是谁的锅；
        # `|| true` 是刻意的：这一步只为留下证据，不能让它的结果盖掉真正的失败信息。
        if: failure()
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          python -m pytest tests -q --tb=short -p no:randomly -p no:cacheprovider -x > pytest-fixed.log 2> pytest-fixed-err.log
          Get-Content pytest-fixed.log | Select-Object -Last 5
          Get-Content pytest-fixed-err.log | Select-Object -Last 20

      - name: 固定顺序的证据也上传
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-fixed-order
          path: |
            pytest-fixed.log
            pytest-fixed-err.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 记录环境（排查平台差异用）
        shell: pwsh
        run: |
          python -c "import platform,sys;print('平台',platform.platform());print('Python',sys.version)"
          python -c "import PySide6,pyarrow,pandas;print('PySide6',PySide6.__version__,'| pyarrow',pyarrow.__version__,'| pandas',pandas.__version__)"

      - id: pack
        name: PyInstaller 打包
        # 15 → 25 分钟：本步在 Windows runner 上本来就慢，而它一超时就是「测试全过、包没出来」
        # （2026-09-21 排查中发现：失败根本不在测试那一步，而在打包/检查这一段）。
        timeout-minutes: 25
        shell: pwsh
        run: |
          # 用 `*>` 重定向而不是管道：管道里 `$LASTEXITCODE` 的语义要靠运气
          # （上一版就因为这类写法差点把失败当成成功），重定向后退出码就是 pyinstaller 的
          pyinstaller --noconfirm --clean build/laoa_trader.spec *> pyinstaller.log
          $code = $LASTEXITCODE
          Get-Content pyinstaller.log | Select-Object -Last 10
          if ($code -ne 0) { Write-Host "::error::PyInstaller 失败（退出码 $code），详见 pyinstaller.log"; exit 1 }

      - id: keygen_in_pkg
        name: 把注册机一并放进包里（作者自用；**分发前必须删掉**）
        shell: pwsh
        run: |
          # 主人 2026-09-21 的决定："直接把注册机打包到程序包里也可以的" ——
          # 他的理由是他正式分发时会**重新打包**，所以 CI 这个包（他自己用）带上更省事：
          # 拿到包就能签码，不必再点一次手动 workflow、再去 Release 找 keygen.zip。
          # ⚠️ 代价说清楚：**这个包不能直接发给用户**（注册机里有签发算法）。
          # 名字故意写得刺眼，就是为了"分发前一眼看到、顺手删掉"。
          pyinstaller --noconfirm --clean build/keygen.spec | Out-Null
          if (-not (Test-Path 'dist/keygen.exe')) { throw "注册机没打出来（build/keygen.spec 失败）" }
          $dest = 'dist/LaoniuTrader/注册机-作者专用-别分发给用户.exe'
          Copy-Item 'dist/keygen.exe' $dest -Force
          $kb = (Get-Item $dest).Length / 1KB
          Write-Host ("已把注册机放进包里：{0}（{1:N0} KB）" -f (Split-Path $dest -Leaf), $kb)
          Write-Host "::warning::这个包里带着注册机（作者自用）—— 分发给用户前请删掉「注册机-作者专用-别分发给用户.exe」"

      - id: check
        name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LaoniuTrader/老牛选股.exe")) { throw "没找到 dist/LaoniuTrader/老牛选股.exe" }
          $size = (Get-ChildItem -Recurse 'dist/LaoniuTrader' | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("产物大小：{0:N1} MB" -f $size)
          # ⚠️ 注册机与主产物的关系（2026-09-21 起**反转**了，两边都钉住）：
          #   * **作者这个包**：带**恰好一个**注册机文件，名字固定（分发给用户前要删掉）；
          #   * 主程序**本身**打进的东西里不许混进 keygen（那是 spec/DATAS 层面的泄漏，
          #     与上面这个"刻意放进来、刻意命名的文件"是两回事）。
          # 这样既满足主人"包里带上更省事"，又保留"谁顺手把注册机塞进 DATAS"的拦截。
          $want = 'dist/LaoniuTrader/注册机-作者专用-别分发给用户.exe'
          if (-not (Test-Path $want)) { throw "包里没有注册机（作者自用版应当带上）：$want" }
          $stray = Get-ChildItem -Recurse 'dist/LaoniuTrader' -Include 'keygen*' -ErrorAction SilentlyContinue
          if ($stray) { throw ("注册机文件命名不对（应当只有上面那一个中文名）：" + ($stray.Name -join ', ')) }
          $found = @(Get-ChildItem -Recurse 'dist/LaoniuTrader' -Include '*注册机*' -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            throw ("注册机文件应当只有 1 个，实际 " + $found.Count + " 个：" + ($found.Name -join ', '))
          }
          Write-Warning "这个包带着注册机（作者自用）：分发前删掉「$($found[0].Name)」"
          # 顺手确认关键依赖真的打进去了（缺了会造成运行期报错）
          foreach ($p in @("pandas", "pyarrow", "PySide6")) {
            if (-not (Get-ChildItem -Recurse 'dist/LaoniuTrader' -Filter "*$p*" -ErrorAction SilentlyContinue)) {
              Write-Warning "产物里似乎没找到 $p"
            }
          }
          "产物检查通过" | Set-Content check.log

      - id: zip
        name: 压缩产物（打成一个 zip 再上传）
        shell: pwsh
        run: |
          # 为什么先打 zip：整目录上传在 CI 上失败过一次（step_upload=failure，
          # 而打包与检查都是 success —— 也就是说"包做好了、只是没传上去"）。
          # 打成**单个文件**上传更稳、也更快：dist 目录里有一万多个小文件
          # （PySide6/pyarrow 那一堆），逐个小文件走 artifact 服务既慢又容易在
          # 某一步上翻车；用户下载回来同样是"解压 → 进 LaoniuTrader 目录 → 双击 exe"。
          Compress-Archive -Path 'dist/LaoniuTrader' -DestinationPath 'LaoniuTrader.zip' -Force
          $zip = Get-Item 'LaoniuTrader.zip'
          Write-Host ("压缩包：{0:N1} MB" -f ($zip.Length / 1MB))

      - id: upload
        name: 上传产物
        # ⚠️ 上传失败**不再让整轮变红**（2026-09-21 的结论）：这一步失败跟代码无关 ——
        # 测试全过、打包成功、产物检查全过，唯一红的是"传不上去"，而且换成单个 zip、
        # 连名字换一个再试，照样失败 → 指向**私有仓库的 Actions 存储额度已满**
        # （免费额度 500MB，而这份产物几百 MB，历史上每轮留 14 天攒了十几轮）。
        # 把它标成"继续执行"的理由：额度是**账号侧**的事，不该表现为"代码有问题"；
        # 但失败会被写成 ::warning::（见下一步），并且这里一旦失败就**没有包可下载**，
        # 那才是用户真正要处理的事 —— 所以警告必须显眼、可操作。
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LaoniuTrader
          path: LaoniuTrader.zip
          # ⚠️ 2 天而不是 14：私有仓库的 Actions 存储有硬额度（免费额度 500MB），
          # 而这份产物压缩后就有几百 MB —— 攒十几次就把额度顶爆，之后**上传必失败**
          # （2026-09-21 实测：测试/打包/检查全 success，只有 step_upload=failure）。
          retention-days: 2
          # 0 = 不再二次压缩（zip 已经是压缩过的，再压只是白花时间）
          compression-level: 0
          if-no-files-found: error

      - name: 产物没传上去就说清怎么办
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: |
          # 这一步不会让 job 变红（额度问题是账号侧的事），但必须**显眼且可操作**：
          # 用户看到这条就知道"包没出来"是存储额度满了，去清理旧产物即可。
          Write-Host "::warning::产物没传上 artifact（多半是私有仓库的 Actions 存储额度已满）—— 不影响下载：请去 Release 页面取 https://github.com/Chen-yongjin/laoA/releases/tag/latest （直链 …/releases/download/latest/LaoniuTrader.zip）。想恢复 artifact 通道就到 Actions 里删掉一批旧运行。"

      - name: 上传产物（失败时换名再试一次）
        # 主上传失败不一定是"包有问题"（可能是同名冲突 / 服务端抖动 / 存储额度），
        # 所以再给一次机会、换个名字 —— 用户至少能拿到包。
        if: failure() && hashFiles('LaoniuTrader.zip') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LaoniuTrader-retry-${{ github.run_id }}
          path: LaoniuTrader.zip
          retention-days: 2
          if-no-files-found: ignore

      # 想发版本时打个 tag（如 v0.1.0），这里会自动生成 Release 附件；
      # 产物超过 artifact 上限时用 Release 更稳（单文件上限更宽松）。
      # ── 滚动 Release：固定链接的主下载通道 ──
      # 为什么必须有这一步（2026-09-21 的结论）：私有仓库的 **Actions artifact 存储有硬额度**
      # （免费 500MB），而这份产物压完是几百 MB —— 攒几轮就顶爆，之后 `step_upload` 必失败，
      # 用户就**没有包可下载**（测试/打包/检查全都是 success，唯独传不上去）。
      # Release 附件与 artifact 额度是两回事，而且下载链接**固定不变**，所以把它当主通道：
      #   页面 https://github.com/Chen-yongjin/laoA/releases/tag/latest
      #   直链 https://github.com/Chen-yongjin/laoA/releases/download/latest/LaoniuTrader.zip
      # 用 runner 自带的 `gh`（不引第三方 action，少一个失败点）；
      # 同一个 tag 每次覆盖同名附件（`--clobber`），所以链接永远是那一个。
      # 附件名**不带 SHA**：带 SHA 会每轮多一份几百 MB 的附件、把 Release 也撑爆；
      # 这一轮构建自哪个提交，写在 Release 说明里（每次覆盖更新）。
      - id: release
        name: 把 zip 挂到滚动 Release（固定下载链接）
        if: steps.zip.outcome == 'success'
        # 与 artifact 那一步同理：这一步失败也不该把整轮判红（账号/网络侧的事），
        # 但会记进 meta.txt（step_release）并在下面显眼警告，便于一眼看出走的哪条路。
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          $notes = @"
          ## 老牛选股 · 最新构建

          - 提交：``$env:GITHUB_SHA``
          - 构建：run $env:GITHUB_RUN_ID
          - 下载：``LaoniuTrader.zip``（解压 → 进 LaoniuTrader 目录 → 双击 老牛选股.exe）
          - 注册机（作者专用，**别发给用户**）：同一个 Assets 里的 ``keygen.exe``
          "@
          # 先看 Release 在不在（不在就建一个，tag 指向默认分支即可 —— 我们要的是附件，不是 tag 本身）
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建"
            gh release create $tag --title "老牛选股 · 最新构建" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          gh release upload $tag LaoniuTrader.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败" }
          gh release edit $tag --notes $notes
          Write-Host "::notice::已挂到 Release：https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/LaoniuTrader.zip"

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LaoniuTrader.zip
          generate_release_notes: true

      # ── 构建结果回写 ci-log 分支 ──
      # 无论是成功还是失败都写一次：本机只要 `git fetch origin ci-log` 就能确认
      # "这一版的 CI 到底是绿的还是红的、跑的是哪个 sha"，不必登录 GitHub 看页面。
      # 失败时顺带把完整 pytest.log 一起推上去，就不用手工复制日志了。
      - name: 记录构建结果到 ci-log 分支（成功也记）
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path ci-log | Out-Null
          if (Test-Path pytest.log) { Copy-Item pytest.log ci-log/pytest.log -Force }
          # stderr 也要（线程栈在里面：上次"跑到半路中止"就是靠它定位的）
          if (Test-Path pytest-err.log) { Copy-Item pytest-err.log ci-log/pytest-err.log -Force }
          if (Test-Path pytest-fixed.log) { Copy-Item pytest-fixed.log ci-log/pytest-fixed.log -Force }
          @(
            "run=$env:GITHUB_RUN_ID"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "job=$env:GITHUB_JOB"
            "result=${{ job.status }}"
            # 每一步的结论都记下来：只写一个总的 result 时，根本看不出"是测试挂了还是打包挂了"
            # （2026-09-21 就为此白跑了两轮 CI：测试明明 1622 条全过，失败却在后面几步）。
            "step_test=${{ steps.test.outcome }}"
            "step_pack=${{ steps.pack.outcome }}"
            "step_check=${{ steps.check.outcome }}"
            "step_zip=${{ steps.zip.outcome }}"
            "step_upload=${{ steps.upload.outcome }}"
            # Release 那条路（主下载通道）：它 success 就说明包已经能下载了，
            # 哪怕 step_upload 因额度失败也不影响用户拿包
            "step_release=${{ steps.release.outcome }}"
            # Release 上现在有哪些附件（keygen.exe 由**另一个 job**传，两个 job 的先后不保证；
            # 记下来是为了"注册机到底传上去没有"这件事**不用翻 Actions 页面**就能查）
            "release_assets=${{ steps.release.outcome == 'success' && '见下一步' || '未取' }}"
          ) | Set-Content ci-log/meta.txt
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          $assets = gh release view latest --json assets --jq '[.assets[].name] | join(",")' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) { Add-Content ci-log/meta.txt "release_assets=$assets" }
          if (Test-Path pyinstaller.log) { Copy-Item pyinstaller.log ci-log/pyinstaller.log -Force }
          if (Test-Path check.log) { Copy-Item check.log ci-log/check.log -Force }
          Get-Content ci-log/meta.txt
          git add -f ci-log
          git commit -m "CI 结果：${{ job.status }}（run $env:GITHUB_RUN_ID）" --no-verify
          git push -f origin HEAD:ci-log


  # ── 注册机（作者的签发工具）：**独立 job + 独立 artifact**，与主包彻底分开 ──
  #
  # 为什么不并进 build job、也不放进主 artifact：
  #   注册机里带着签发密钥的算法 —— 谁能拿到它，谁就能给任意机器码算出注册码。
  #   主 artifact（LaoniuTrader）是发给用户的，注册机只能作者自己拿，所以两边必须分开。
  #
  # 为什么只在手动触发时跑：
  #   它跟"用户拿到的那一版"没关系，每次 push 都白跑一个 Windows runner 没必要。
  #   想拿注册机：Actions → build-windows → Run workflow（手动触发）→ 跑完下载
  #   artifact `keygen`。作者本地打包同样可以（见 docs/打包教程.md 第八·五节）：
  #   `pyinstaller --noconfirm --clean build\keygen.spec`。
  keygen:
    # 什么时候跑：
    #   ① 主人手动触发（Actions → build-windows → Run workflow）；
    #   ② **改动到注册机相关文件**时（spec / 签发算法 / 这个 workflow 自己）——
    #      这样"注册机该更新了"这件事不用靠人记得去点一下，我也能在推代码后直接验证它。
    # 其余 push 不跑（Windows runner 很贵，注册机跟用户那版没关系）。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'build/keygen.spec') ||
        contains(github.event.head_commit.modified, 'build/keygen.py') ||
        contains(github.event.head_commit.modified, 'src/laoa_trader/licensing.py') ||
        contains(github.event.head_commit.modified, '.github/workflows/build-windows.yml')
      ))
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - id: keygen_pack
        name: PyInstaller 打包注册机
        timeout-minutes: 10
        run: pyinstaller --noconfirm --clean build/keygen.spec

      - id: keygen_check
        name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/keygen.exe")) { throw "没找到 dist/keygen.exe" }
          $size = (Get-Item 'dist/keygen.exe').Length / 1MB
          Write-Host ("注册机大小：{0:N1} MB" -f $size)

      # ── 主下载通道：挂到与主程序同一个滚动 Release ──
      # 为什么不再只靠 artifact（2026-09-21 的教训）：私有仓库的 artifact 存储有硬额度
      # （免费 500MB，主包一封就几百 MB），额度满了**上传必失败** —— 主人手动跑了
      # workflow 也拿不到注册机。Release 附件与那份额度是两回事、链接还固定，
      # 所以从这里下载：Release 页面 → Assets → keygen.exe（与 LaoniuTrader.zip 同一个页面）。
      - id: keygen_release
        name: 把注册机挂到滚动 Release（与主程序同一个页面）
        # ⚠️ 这一步**故意不写 continue-on-error**（与主程序那一步相反）：注册机没有第二个
        # 下载通道，它必须真的传上去。让"这个 job 是绿的"直接等价于"keygen.exe 已在 Release 上"，
        # 看颜色就知道成没成，不用翻日志（2026-09-21 主人手动跑了却拿不到东西，
        # 就是因为原来那一步走 artifact、失败了还被标成"不影响"）。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，先创建一个（主程序那一轮通常会先建好）"
            gh release create $tag --title "老牛选股 · 最新构建" --notes "见 Assets：主程序与注册机"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          # 打成 keygen.zip 再挂：与主程序同一个页面、同一个附件风格（解压即得 keygen.exe），
          # 也避免"裸 exe 被浏览器/杀软拦下"这类下载端的麻烦。
          Compress-Archive -Path 'dist/keygen.exe' -DestinationPath 'keygen.zip' -Force
          gh release upload $tag keygen.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 keygen.zip 到 Release 失败" }
          Write-Host "Release 现有附件："
          gh release view $tag --json assets --jq '.assets[].name'
          Write-Host "::notice::注册机已挂到 Release：https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/keygen.zip"

      - id: keygen_upload
        name: 上传注册机 artifact（额度满了会失败，不影响上面的 Release）
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: keygen
          path: keygen.zip
          retention-days: 2
          if-no-files-found: error

      - name: artifact 没传上去就说清去哪下
        if: steps.keygen_upload.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::注册机没传上 artifact（私有仓库存储额度已满，官方原文：Artifact storage quota has been hit）—— 不影响下载：去 Release 页面取 keygen.zip（与主程序同一个页面）。"

      # 结果同样写回 ci-log：只写 ci-log/keygen-meta.txt（**不动** build job 写的 meta.txt），
      # 并且从远端 ci-log 的状态开始改再推 —— 两个 job 可能同时在写这个分支，
      # 直接 force-push 会把对方那份结果抹掉（这就是为什么下面带重试 + rebase）。
      - name: 记录注册机构建结果到 ci-log 分支
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          @(
            "run=$env:GITHUB_RUN_ID"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "job=$env:GITHUB_JOB"
            "result=${{ job.status }}"
            "step_keygen_pack=${{ steps.keygen_pack.outcome }}"
            "step_keygen_check=${{ steps.keygen_check.outcome }}"
            "step_keygen_release=${{ steps.keygen_release.outcome }}"
            "step_keygen_upload=${{ steps.keygen_upload.outcome }}"
          ) | Set-Content keygen-meta.txt
          # 附件清单：`keygen.zip` 在里面 = 主人真的能下载到（artifact 额度爆了也不影响这条）
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          $assets = gh release view latest --json assets --jq '[.assets[].name] | join(",")' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) { Add-Content keygen-meta.txt "release_assets=$assets" }
          Get-Content keygen-meta.txt
          # 只更新 ci-log/keygen-meta.txt，而且**从远端 ci-log 的现状开始改**再推：
          # build 与 keygen 两个 job 可能同时在写这个分支，各自 force-push 会把对方那份抹掉。
          # 用 FETCH_HEAD（不依赖本地已有分支）+ 多次重试，尽量减少"推送被拒"造成的丢记录。
          $pushed = $false
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin ci-log --depth=1 *> $null
            if ($LASTEXITCODE -ne 0) { Write-Host "拉取 ci-log 失败，重试第 $i 次"; Start-Sleep -Seconds 8; continue }
            git checkout -B ci-log-push FETCH_HEAD *> $null
            New-Item -ItemType Directory -Force -Path ci-log | Out-Null
            Copy-Item keygen-meta.txt ci-log/keygen-meta.txt -Force
            git add -f ci-log
            git commit -m "注册机结果：${{ job.status }}（run $env:GITHUB_RUN_ID）" --no-verify *> $null
            git push origin HEAD:ci-log
            if ($LASTEXITCODE -eq 0) { $pushed = $true; Write-Host "已写入 ci-log/keygen-meta.txt"; break }
            Write-Host "推送被拒（另一个 job 也在写 ci-log），第 $i 次重试"
            Start-Sleep -Seconds 8
          }
          if (-not $pushed) { Write-Host "::warning::没能把注册机结果写回 ci-log（不影响 keygen.exe 本身）" }
