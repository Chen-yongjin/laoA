# 在 GitHub 的 Windows 运行器上自动打包「老牛选股」
#
# 用法（你本机不需要装 Python）：
#   1. 代码推到 main 后会自动构建；也可以在 Actions 页面点 "Run workflow" 手动触发
#   2. 构建完成后，**优先去 Release 页面下载**（固定链接，不受 artifact 额度影响）：
#      https://github.com/Chen-yongjin/laoA/releases/tag/latest
#      直链：https://github.com/Chen-yongjin/laoA/releases/download/latest/LaoniuTrader.zip
#   3. 解压后双击 老牛选股.exe 即可（首次运行会走数据自检 → 下载向导）
#   注：该次运行页面底部的 Artifacts 里也有一份（LaoniuTrader），但 artifact 有额度限制，
#       额度满了那一步会失败 —— 所以 Release 才是主下载通道（见下面 step_release）。
#   注册机（作者专用）**不在这个包里**：手动跑下面的 keygen job，产物是同一个 Release
#   页面 Assets 里的 ``keygen.zip``（解压得 ``keygen.exe``）。
#
# 说明：
# - 测试不过就不出包（pytest 失败即整轮失败），避免把坏版本发出去
# - **默认用 Nuitka 编译**（2026-09-22 主人拍板）：编译成原生 exe，源码不能被解包还原；
#   手动触发时可以选 `builder=pyinstaller` 走备用路径（build/laoa_trader.spec 仍保留）
# - 构建完会**真的把 exe 跑一次**（`--doctor` 自检）再打包：编译版的路径解析最容易静默出错
# - 产物是 onedir 目录版（启动快、杀软误报少），压缩后通常 200~400MB
# - 构建失败时会额外上传 pytest-log 产物（里面是完整测试输出），报错时先看它
# - action 版本已升到 v7（Node 24 运行时），不会再出现 Node.js 20 deprecated 告警
name: build-windows

on:
  workflow_dispatch:          # 手动触发（推荐：想发包时点一下）
    inputs:
      skip_tests:
        description: "跳过测试直接打包（仅在 CI 平台问题未解决时用）"
        type: boolean
        default: false
      builder:
        description: "用哪个构建器（默认 Nuitka 编译版；PyInstaller 是备用路径）"
        type: choice
        options: [nuitka, pyinstaller]
        default: nuitka
  push:
    branches: [main]
    paths-ignore:             # 只改文档就不必跑构建，省额度
      - "docs/**"
      - "**.md"

permissions:
  contents: write   # 失败时把 pytest.log 推回 ci-log 分支，便于本地直接 git fetch 查看

# 同一分支只留最新一次构建：连续推几次时，旧的那次直接取消 ——
# Windows 运行器很贵（额度按 2 倍算），排在后面的构建跑完也没人看。
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # 60 → 150 分钟：Nuitka 要**编译**（不是打包）整个 pandas/pyarrow/PySide6 依赖图，
    # 在 2 核 runner 上实测明显慢于 PyInstaller；再叠上那 20~40 分钟的测试，
    # 60 分钟极可能"测试全过、卡在编译上被判失败"（本项目已经为这类超时白跑过一轮）。
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"                       # Windows 上避免中文路径/日志乱码
      # 崩了要能看到"是哪条线程/哪一行崩的"：`Fatal Python error: Aborted` 这类中止
      # 默认只给一段 C 栈，打开 faulthandler 会连 Python 侧的线程栈一起打出来
      # （2026-09-20 那次"偶发中止"就是靠它才定位到"孤儿桌宠"的）。
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 心跳：把"这一轮已经启动"写进 ci-log（失败也不影响构建）
        # 为什么要有这一步（2026-09-23 的教训）：仓库是私密的、artifact 又拿不到，
        # 而 ci-log 只在**job 末尾**写一次 —— 于是 push 之后 80 分钟没有任何信号，
        # 完全分不清"这一轮根本没启动（Actions 额度/排队/账单问题）"和"还在跑"。
        # 心跳让"已启动"在一分钟内可见，也让"没启动"能立刻被证明。
        continue-on-error: true
        shell: pwsh
        run: |
          @(
            "sha=$env:GITHUB_SHA"
            "run=$env:GITHUB_RUN_ID"
            "attempt=$env:GITHUB_RUN_ATTEMPT"
            "runner_os=$env:RUNNER_OS"
            "started=$((Get-Date).ToUniversalTime().ToString('o'))"
            "builder=${{ inputs.builder || 'nuitka' }}"
          ) | Set-Content heartbeat.txt
          $blob = (git hash-object -w heartbeat.txt)
          # ⚠️ 用**临时索引**做 plumbing（read-tree/commit-tree/push 一个对象），
          # 绝不 `git checkout` 到 ci-log 分支 —— 那会把主工作树切走，
          # 后面的测试与构建就会跑在 ci-log 分支的内容上（那是另一份旧快照）。
          $idx = Join-Path $env:RUNNER_TEMP "ci-heartbeat-index"
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin ci-log --depth=1 2>$null
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 5; continue }
            Remove-Item $idx -ErrorAction SilentlyContinue
            $env:GIT_INDEX_FILE = $idx
            git read-tree FETCH_HEAD 2>$null
            git update-index --add --cacheinfo "100644,$blob,ci-log/heartbeat.txt" 2>$null
            $tree = (git write-tree)
            # ⚠️ 显式给身份：检出后的工作树常常没配 user.name/email，
            # 而 commit-tree 没有身份会直接失败（心跳就静默没了）
            $commit = (git -c user.name=ci-log-bot -c user.email=ci-log-bot@users.noreply.github.com `
              commit-tree $tree -p FETCH_HEAD -m "心跳：run $env:GITHUB_RUN_ID 已启动")
            git push origin "${commit}:ci-log" 2>$null
            $ok = $LASTEXITCODE
            Remove-Item Env:\GIT_INDEX_FILE -ErrorAction SilentlyContinue
            if ($ok -eq 0) { Write-Host "心跳已写入 ci-log/heartbeat.txt"; exit 0 }
            Start-Sleep -Seconds 5
          }
          Write-Host "::warning::心跳没能写进 ci-log（不影响构建）"

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - id: test
        name: 跑测试（不通过就不出包）
        # 本机约 5 分钟，Windows runner 实测约 20 分钟（慢约 3~4 倍），上限必须留足：
        # 2026-09-21 那轮就是「1622 条测试全过、却因为这一步撞上 20 分钟上限」被判失败。
        timeout-minutes: 40
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        shell: pwsh
        run: |
          # ⚠️ 这里**不用** `Tee-Object` 管道：2026-09-21 那次"跑到 89~93% 就没声音了"
          # 的排查中，管道的缓冲把中止前最后那段（faulthandler 的线程栈）吞掉了 ——
          # 直接重定向到两个文件最可靠：stdout 是 pytest 的进度与失败摘要，
          # stderr 里才有 `Thread 0x… (most recent call first)` 这样的**线程栈**。
          # `-p no:cacheprovider` 与本地一致；`--tb=short` 便于失败摘要读取。
          $env:PYTHONFAULTHANDLER = "1"
          # `faulthandler` 的"卡住 N 秒就 dump 所有线程栈"兜底：正常跑完不会触发
          # ⚠️ 用 `-o faulthandler_timeout=`（ini 形式）而不是 `--faulthandler-timeout=`：
          # 2026-09-21 实测后者会被当成未知参数、pytest 直接报错退出（CI 因为这条红过一次，
          # 测试压根没跑起来）。它的作用是"某条用例卡住超过 N 秒就把所有线程栈 dump 出来"。
          python -m pytest tests -q --tb=short -p no:cacheprovider -o faulthandler_timeout=900 > pytest.log 2> pytest-err.log
          $code = $LASTEXITCODE
          Get-Content pytest.log | Select-Object -Last 3
          if (Test-Path pytest-err.log) {
            $errLines = (Get-Content pytest-err.log).Count
            Write-Host "stderr 行数：$errLines（线程栈/日志报错都在这里）"
            Get-Content pytest-err.log | Select-Object -Last 30
          }
          if ($code -ne 0) {
            Write-Host "::error::测试未通过，详见 pytest.log / pytest-err.log 产物"
            exit 1
          }

      - name: 失败摘要（直接变成 GitHub 注解，便于复制定位）
        if: failure() && hashFiles('pytest.log') != ''
        shell: pwsh
        run: |
          # 把每条失败用例 + 紧随其后的错误行，输出成 ::error:: 注解
          # 这样在 Actions 页面的 "Annotations" 区域就能看到，不必下载产物
          $lines = Get-Content pytest.log
          $buf = @()
          foreach ($l in $lines) {
            if ($l -match '^FAILED ') { $buf += $l }
            elseif ($l -match '^E\s+' -and $buf.Count -gt 0 -and $buf[-1] -notmatch '^\s*E') { $buf[-1] = "$($buf[-1]) || $($l.Trim())" }
          }
          foreach ($b in $buf | Select-Object -First 20) { Write-Host "::error::$b" }
          $summary = ($lines | Where-Object { $_ -match 'passed|failed|error' } | Select-Object -Last 1)
          Write-Host "::error::测试汇总：$summary"

      - name: 失败时上传测试日志（**含 stderr**）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log
          # 两个都传：pytest 的进度/摘要在 pytest.log，而**线程栈只在 stderr**
          # （上次那种"跑到半路中止、没有失败记录"必须靠它才能定位）
          path: |
            pytest.log
            pytest-err.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时用固定顺序再跑一遍（便于本地复现，不参与判定）
        # 随机顺序下崩在"某条用例留下的线程/窗口"上时，固定顺序往往能说清是谁的锅；
        # `|| true` 是刻意的：这一步只为留下证据，不能让它的结果盖掉真正的失败信息。
        if: failure()
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          python -m pytest tests -q --tb=short -p no:randomly -p no:cacheprovider -x > pytest-fixed.log 2> pytest-fixed-err.log
          Get-Content pytest-fixed.log | Select-Object -Last 5
          Get-Content pytest-fixed-err.log | Select-Object -Last 20

      - name: 固定顺序的证据也上传
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-fixed-order
          path: |
            pytest-fixed.log
            pytest-fixed-err.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 记录环境（排查平台差异用）
        shell: pwsh
        run: |
          python -c "import platform,sys;print('平台',platform.platform());print('Python',sys.version)"
          python -c "import PySide6,pyarrow,pandas;print('PySide6',PySide6.__version__,'| pyarrow',pyarrow.__version__,'| pandas',pandas.__version__)"

      # ── 主构建：Nuitka（编译成原生 exe）──
      # 2026-09-22 主人拍板：「用 Nuitka/Cython 把程序编译一遍，不再加其它壳」。
      # PyInstaller 只是把 .pyc 打进包，解包工具几分钟就能还原源码；Nuitka 编译成 C 再编成
      # 原生 exe，逆向门槛高一个量级，也不必再叠商业壳（那些壳会抬高杀软误报率）。
      # 两条路都保留（手动触发时可选 builder），Nuitka 出问题时一键退回 PyInstaller。
      - id: pack
        name: Nuitka 构建（编译成原生 exe）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.builder != 'pyinstaller' }}
        # 90 分钟：Nuitka 要编译整个依赖图，比 PyInstaller 慢得多（超时=测试全过、包没出来）
        timeout-minutes: 90
        shell: pwsh
        run: |
          # 用 `*>` 重定向而不是管道：管道里 `$LASTEXITCODE` 的语义要靠运气
          # （上一版就因为这类写法差点把失败当成成功），重定向后退出码就是构建器的
          python build/nuitka_build.py *> nuitka.log
          $code = $LASTEXITCODE
          Get-Content nuitka.log | Select-Object -Last 20
          if ($code -ne 0) {
            Write-Host "::error::Nuitka 构建失败（退出码 $code），详见 nuitka.log"
            exit 1
          }

      # ── 备用构建：PyInstaller（手动触发时选 builder=pyinstaller）──
      - id: pack_fallback
        name: PyInstaller 打包（备用路径）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.builder == 'pyinstaller' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean build/laoa_trader.spec *> pyinstaller.log
          $code = $LASTEXITCODE
          Get-Content pyinstaller.log | Select-Object -Last 10
          if ($code -ne 0) { Write-Host "::error::PyInstaller 失败（退出码 $code），详见 pyinstaller.log"; exit 1 }

      - id: check
        name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LaoniuTrader/老牛选股.exe")) { throw "没找到 dist/LaoniuTrader/老牛选股.exe" }
          $size = (Get-ChildItem -Recurse 'dist/LaoniuTrader' | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("产物大小：{0:N1} MB" -f $size)
          # ⚠️ 2026-09-21 主人要求：「下面的包不要带注册机了，我已经保存了」——
          # 所以主程序包里**必须没有注册机**（这条也是"谁顺手把注册机塞进 spec/DATAS"的拦截：
          # 注册机里有签发算法，混进用户包等于授权形同虚设）。
          # 作者要用注册机走另一条路：手动跑 keygen job（见文件末尾那个 job），
          # 产物挂在同一个 Release 上的 keygen.zip。
          $stray = Get-ChildItem -Recurse 'dist/LaoniuTrader' -Include 'keygen*','*注册机*' -ErrorAction SilentlyContinue
          if ($stray) {
            throw ("包里不该有注册机（主人 2026-09-21 要求）：" + ($stray.Name -join ', '))
          }
          Write-Host "包里没有注册机（符合预期：注册机由 keygen job 单独产出）"

          # 顺手确认关键依赖真的打进去了（缺了会造成运行期报错）
          foreach ($p in @("pandas", "pyarrow", "PySide6")) {
            if (-not (Get-ChildItem -Recurse 'dist/LaoniuTrader' -Filter "*$p*" -ErrorAction SilentlyContinue)) {
              Write-Warning "产物里似乎没找到 $p"
            }
          }
          "产物检查通过" | Set-Content check.log

      # ── 编译产物的冒烟检查：**真的把 exe 跑起来** ──
      # 为什么必须有这一步：Nuitka 换的是"路径解析"这类最容易静默出错的地方
      # （图标没了、随包策略列表空了，程序照样能起来）。自检报告会写明
      # "运行形态 / 程序位置 / 随包资源 / 资源目录 / 随包策略"，所以这里跑一次 --doctor
      # 再**读那个报告文件**：GUI 子系统的 exe 没有控制台，重定向 stdout 不一定拿得到内容，
      # 读文件最稳（这也是用户报障时要发给我们的那份东西）。
      - id: smoke
        name: 冒烟：跑一次编译产物的自检
        timeout-minutes: 10
        shell: pwsh
        run: |
          # ⚠️ 这一步的一切都写进 smoke.log（**成功也写**）：仓库是私密的、artifact 额度又爆了，
          # 失败时既看不到 Actions 控制台、也拿不到 artifact —— 只有 ci-log 分支能看。
          # 所以"红在哪、exe 输出了什么、报告写到了哪"必须落进这个文件，否则下次还得靠猜。
          $log = "smoke.log"
          "===== 冒烟：编译产物自检 =====" | Set-Content $log
          Add-Content $log "run=$env:GITHUB_RUN_ID  sha=$env:GITHUB_SHA"

          # 独立的临时数据目录：自检报告落到这里，路径可预测
          $cfg = Join-Path $PWD "ci-smoke-config.toml"
          $dataDir = Join-Path $PWD "ci-smoke-data"
          # ⚠️ 用 .NET 显式写「UTF-8 无 BOM」：PowerShell 5.1 的 `Set-Content -Encoding utf8` 会加 BOM，
          # 而本项目的配置读取按无 BOM 处理（BOM 会让第一个键名变成 \ufeffdata_dir、data_dir 被
          # 当成未知键忽略 —— 表现是「自检报告写到了别处」，排查极费时间）。
          $content = "data_dir = `"$($PWD.Path -replace '\\','/')/ci-smoke-data`"`n"
          [System.IO.File]::WriteAllText($cfg, $content, (New-Object System.Text.UTF8Encoding($false)))
          Add-Content $log "配置文件：$cfg → $content"

          $exe = "dist/LaoniuTrader/老牛选股.exe"
          Add-Content $log ("exe 存在：{0}  大小：{1} 字节" -f (Test-Path $exe), (Get-Item $exe -ErrorAction SilentlyContinue).Length)
          Add-Content $log "----- dist/LaoniuTrader 前 25 项 -----"
          Get-ChildItem "dist/LaoniuTrader" -ErrorAction SilentlyContinue |
            Select-Object -First 25 | ForEach-Object { Add-Content $log ("  " + $_.Name) }

          # 为什么每个子进程都重定向到文件：GUI 子系统的 exe 没有控制台，`Write-Host` 抓不到它的输出，
          # 只有把 stdout/stderr 重定向到文件才拿得到 —— 而"exe 到底打印了什么"正是诊断的关键。
          function Invoke-Exe([string]$Tag, [string[]]$Arguments) {
            $out = "$Tag.out.txt"
            $err = "$Tag.err.txt"
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -PassThru `
              -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            Add-Content $log "===== $Tag 退出码：$($proc.ExitCode) ====="
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) {
                Add-Content $log "----- $Tag $([System.IO.Path]::GetFileName($f))（前 40 行）-----"
                Get-Content $f -TotalCount 40 | ForEach-Object { Add-Content $log ("  " + $_) }
              }
            }
            return $proc.ExitCode
          }

          # 先跑 --version（最便宜的"它到底能不能起来"，输出里带版本 + 构建形态 + 函数数）
          $verCode = Invoke-Exe "version" @("--cli", "--version", "--config", $cfg)
          # 再跑 --doctor（会把报告同时写盘）
          $docCode = Invoke-Exe "doctor" @("--cli", "--doctor", "--config", $cfg)

          # 报告可能落在两处：指定的数据目录（--config 生效）或**默认数据目录**（--config 没被认时）。
          # 两处都找 —— 否则报错会是"没写出报告"，而真相是"写到了别处"。
          $report = $null
          for ($i = 0; $i -lt 20 -and -not $report; $i++) {
            Start-Sleep -Milliseconds 500
            $dirs = @("$dataDir/logs", (Join-Path $env:LOCALAPPDATA "LaoATrader/data/logs"))
            foreach ($d in $dirs) {
              $found = Get-ChildItem $d -Filter *.txt -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($found) { $report = $found; break }
            }
          }

          Add-Content $log "----- 数据目录 ci-smoke-data -----"
          Get-ChildItem -Recurse -Force $dataDir -ErrorAction SilentlyContinue |
            Select-Object -First 40 | ForEach-Object { Add-Content $log ("  " + $_.FullName) }
          Add-Content $log "----- 默认数据目录（%LOCALAPPDATA%）-----"
          Get-ChildItem -Recurse -Force (Join-Path $env:LOCALAPPDATA "LaoATrader/data") -ErrorAction SilentlyContinue |
            Select-Object -First 40 | ForEach-Object { Add-Content $log ("  " + $_.FullName) }

          if (-not $report) {
            Add-Content $log "❌ 没找到任何自检报告（两处都没找到）"
            Get-Content $log | Write-Host
            throw "编译产物没写出自检报告：要么它起来就崩了（看 smoke.log 里 version/doctor 的退出码与输出），要么报告写到了别处（smoke.log 里有两处的目录树）"
          }
          Add-Content $log "自检报告：$($report.FullName)"
          Add-Content $log "----- 自检报告全文 -----"
          Get-Content $report.FullName | ForEach-Object { Add-Content $log ("  " + $_) }

          $text = Get-Content $report.FullName -Raw
          if ($verCode -ne 0 -or $docCode -ne 0) {
            Add-Content $log "❌ 退出码异常：version=$verCode doctor=$docCode"
            Get-Content $log | Write-Host
            throw "编译产物退出码异常（version=$verCode doctor=$docCode）—— 详见 ci-log/smoke.log"
          }
          if ($text -notmatch "运行形态\s*:\s*Nuitka") {
            Add-Content $log "❌ 报告里没有 Nuitka 形态"
            Get-Content $log | Write-Host
            throw "自检报告里没有 Nuitka 形态（详见 ci-log/smoke.log）"
          }
          if ($text -notmatch "随包策略\s*:\s*[^\r\n]*formulas") {
            Add-Content $log "❌ 随包策略目录没解析出来"
            Get-Content $log | Write-Host
            throw "随包策略目录没解析出来（编译版的 --include-data-dir 没生效？详见 ci-log/smoke.log）"
          }
          if ($text -notmatch "资源目录\s*:\s*[^\r\n]*assets") {
            Add-Content $log "❌ 资源目录没解析出来"
            Get-Content $log | Write-Host
            throw "资源目录没解析出来（图标会全丢，详见 ci-log/smoke.log）"
          }
          Add-Content $log "✅ 冒烟通过：形态 Nuitka、随包策略与资源目录都解析正常"
          Get-Content $log | Write-Host

      - name: 失败时上传构建日志（构建器换了之后更要留档）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            nuitka.log
            pyinstaller.log
          retention-days: 3
          if-no-files-found: ignore

      - id: zip
        name: 压缩产物（打成一个 zip 再上传）
        shell: pwsh
        run: |
          # 为什么先打 zip：整目录上传在 CI 上失败过一次（step_upload=failure，
          # 而打包与检查都是 success —— 也就是说"包做好了、只是没传上去"）。
          # 打成**单个文件**上传更稳、也更快：dist 目录里有一万多个小文件
          # （PySide6/pyarrow 那一堆），逐个小文件走 artifact 服务既慢又容易在
          # 某一步上翻车；用户下载回来同样是"解压 → 进 LaoniuTrader 目录 → 双击 exe"。
          Compress-Archive -Path 'dist/LaoniuTrader' -DestinationPath 'LaoniuTrader.zip' -Force
          # 2026-09-30 用户要求：另外留一份**带版本号**的包，方便一眼认出是哪个版本。
          # 固定名 LaoniuTrader.zip 继续保留（Release 固定直链、站点兜底都靠它，不能改掉）。
          $ver = (Select-String -Path 'src/laoa_trader/__init__.py' -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Copy-Item 'LaoniuTrader.zip' "LaoniuTrader-$ver.zip" -Force
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $zip = Get-Item 'LaoniuTrader.zip'
          Write-Host ("压缩包：{0:N1} MB   带版本号的副本：LaoniuTrader-{1}.zip" -f ($zip.Length / 1MB), $ver)

      - id: zipcheck
        name: 包内容自检：解压确认 exe 在、且没有注册机
        shell: pwsh
        run: |
          # 为什么要解压看一遍：zip 是谁都能做的（`Compress-Archive` 也会在目录选错时"成功"，
          # 结果包里是空的或少了东西）；而主人看不到 Actions 控制台，所以结论要落进
          # ci-log/zipcheck.log + meta.txt（附件名/字节数/sha256 就是"包真的完整"的证据）。
          $log = "zipcheck.log"
          "===== 包内容自检 =====" | Set-Content $log
          $zip = Get-Item 'LaoniuTrader.zip'
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          Add-Content $log ("文件：{0}  字节：{1}  sha256：{2}" -f $zip.Name, $zip.Length, $hash)
          "zip_name=$($zip.Name)" | Set-Content zip-meta.txt
          "zip_version=${{ steps.zip.outputs.ver }}" | Add-Content zip-meta.txt
          "zip_bytes=$($zip.Length)" | Add-Content zip-meta.txt
          "zip_sha256=$hash" | Add-Content zip-meta.txt

          Add-Content $log "----- 包内前 15 项 -----"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            $names | Select-Object -First 15 | ForEach-Object { Add-Content $log ("  " + $_) }
            $exeEntry = $names | Where-Object { $_ -match 'LaoniuTrader/老牛选股\.exe$' }
            if (-not $exeEntry) {
              Add-Content $log "❌ 包里没有 LaoniuTrader/老牛选股.exe"
              Get-Content $log | Write-Host
              throw "产出的 zip 里没有 LaoniuTrader/老牛选股.exe（详见 ci-log/zipcheck.log）"
            }
            Add-Content $log "✅ 主程序在：$exeEntry"
            # 注册机绝不能进用户的包（里面带签发算法）—— 反向检查，出现就红
            $keygen = $names | Where-Object { $_ -match '(?i)keygen|注册机' }
            if ($keygen) {
              Add-Content $log "❌ 包里出现了注册机相关文件：$($keygen -join ', ')"
              Get-Content $log | Write-Host
              throw "用户的包里不许有注册机（详见 ci-log/zipcheck.log）"
            }
            Add-Content $log "✅ 包里没有注册机"
            $count = ($names | Measure-Object).Count
            Add-Content $log "✅ 包内文件数：$count"
            "zip_files=$count" | Add-Content zip-meta.txt
          } finally {
            $archive.Dispose()
          }
          Get-Content $log | Write-Host

      - id: upload
        name: 上传产物
        # ⚠️ 上传失败**不再让整轮变红**（2026-09-21 的结论）：这一步失败跟代码无关 ——
        # 测试全过、打包成功、产物检查全过，唯一红的是"传不上去"，而且换成单个 zip、
        # 连名字换一个再试，照样失败 → 指向**私有仓库的 Actions 存储额度已满**
        # （免费额度 500MB，而这份产物几百 MB，历史上每轮留 14 天攒了十几轮）。
        # 把它标成"继续执行"的理由：额度是**账号侧**的事，不该表现为"代码有问题"；
        # 但失败会被写成 ::warning::（见下一步），并且这里一旦失败就**没有包可下载**，
        # 那才是用户真正要处理的事 —— 所以警告必须显眼、可操作。
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LaoniuTrader
          path: |
            LaoniuTrader.zip
            LaoniuTrader-${{ steps.zip.outputs.ver }}.zip
          # ⚠️ 2 天而不是 14：私有仓库的 Actions 存储有硬额度（免费额度 500MB），
          # 而这份产物压缩后就有几百 MB —— 攒十几次就把额度顶爆，之后**上传必失败**
          # （2026-09-21 实测：测试/打包/检查全 success，只有 step_upload=failure）。
          retention-days: 2
          # 0 = 不再二次压缩（zip 已经是压缩过的，再压只是白花时间）
          compression-level: 0
          if-no-files-found: error

      - name: 产物没传上去就说清怎么办
        if: steps.upload.outcome == 'failure'
        shell: pwsh
        run: |
          # 这一步不会让 job 变红（额度问题是账号侧的事），但必须**显眼且可操作**：
          # 用户看到这条就知道"包没出来"是存储额度满了，去清理旧产物即可。
          Write-Host "::warning::产物没传上 artifact（多半是私有仓库的 Actions 存储额度已满）—— 不影响下载：请去 Release 页面取 https://github.com/Chen-yongjin/laoA/releases/tag/latest （直链 …/releases/download/latest/LaoniuTrader.zip）。想恢复 artifact 通道就到 Actions 里删掉一批旧运行。"

      - name: 上传产物（失败时换名再试一次）
        # 主上传失败不一定是"包有问题"（可能是同名冲突 / 服务端抖动 / 存储额度），
        # 所以再给一次机会、换个名字 —— 用户至少能拿到包。
        if: failure() && hashFiles('LaoniuTrader.zip') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: LaoniuTrader-retry-${{ github.run_id }}
          path: |
            LaoniuTrader.zip
            LaoniuTrader-${{ steps.zip.outputs.ver }}.zip
          retention-days: 2
          if-no-files-found: ignore

      # 想发版本时打个 tag（如 v0.1.0），这里会自动生成 Release 附件；
      # 产物超过 artifact 上限时用 Release 更稳（单文件上限更宽松）。
      # ── 滚动 Release：固定链接的主下载通道 ──
      # 为什么必须有这一步（2026-09-21 的结论）：私有仓库的 **Actions artifact 存储有硬额度**
      # （免费 500MB），而这份产物压完是几百 MB —— 攒几轮就顶爆，之后 `step_upload` 必失败，
      # 用户就**没有包可下载**（测试/打包/检查全都是 success，唯独传不上去）。
      # Release 附件与 artifact 额度是两回事，而且下载链接**固定不变**，所以把它当主通道：
      #   页面 https://github.com/Chen-yongjin/laoA/releases/tag/latest
      #   直链 https://github.com/Chen-yongjin/laoA/releases/download/latest/LaoniuTrader.zip
      # 用 runner 自带的 `gh`（不引第三方 action，少一个失败点）；
      # 同一个 tag 每次覆盖同名附件（`--clobber`），所以链接永远是那一个。
      # 附件名**不带 SHA**：带 SHA 会每轮多一份几百 MB 的附件、把 Release 也撑爆；
      # 这一轮构建自哪个提交，写在 Release 说明里（每次覆盖更新）。
      - id: release
        name: 把 zip 挂到滚动 Release（固定下载链接）
        if: steps.zip.outcome == 'success'
        # 与 artifact 那一步同理：这一步失败也不该把整轮判红（账号/网络侧的事），
        # 但会记进 meta.txt（step_release）并在下面显眼警告，便于一眼看出走的哪条路。
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          $notes = @"
          ## 老牛选股 · 最新构建

          - 提交：``$env:GITHUB_SHA``
          - 构建：run $env:GITHUB_RUN_ID
          - 下载：``LaoniuTrader.zip``（解压 → 进 LaoniuTrader 目录 → 双击 老牛选股.exe）
          - 注册机（作者专用）：**不在这个包里**，手动跑 keygen job 后从同一个 Release 取 ``keygen.zip``
          "@
          # 先看 Release 在不在（不在就建一个，tag 指向默认分支即可 —— 我们要的是附件，不是 tag 本身）
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建"
            gh release create $tag --title "老牛选股 · 最新构建" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          $ver = "${{ steps.zip.outputs.ver }}"
          gh release upload $tag LaoniuTrader.zip "LaoniuTrader-$ver.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败" }
          gh release edit $tag --notes $notes
          Write-Host "::notice::已挂到 Release：https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/LaoniuTrader.zip"

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LaoniuTrader.zip
          generate_release_notes: true

      # ── 构建结果回写 ci-log 分支 ──
      # 无论是成功还是失败都写一次：本机只要 `git fetch origin ci-log` 就能确认
      # "这一版的 CI 到底是绿的还是红的、跑的是哪个 sha"，不必登录 GitHub 看页面。
      # 失败时顺带把完整 pytest.log 一起推上去，就不用手工复制日志了。
      - name: 记录构建结果到 ci-log 分支（成功也记）
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path ci-log | Out-Null
          if (Test-Path pytest.log) { Copy-Item pytest.log ci-log/pytest.log -Force }
          # stderr 也要（线程栈在里面：上次"跑到半路中止"就是靠它定位的）
          if (Test-Path pytest-err.log) { Copy-Item pytest-err.log ci-log/pytest-err.log -Force }
          if (Test-Path pytest-fixed.log) { Copy-Item pytest-fixed.log ci-log/pytest-fixed.log -Force }
          @(
            "run=$env:GITHUB_RUN_ID"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "job=$env:GITHUB_JOB"
            "result=${{ job.status }}"
            # 每一步的结论都记下来：只写一个总的 result 时，根本看不出"是测试挂了还是打包挂了"
            # （2026-09-21 就为此白跑了两轮 CI：测试明明 1622 条全过，失败却在后面几步）。
            "step_test=${{ steps.test.outcome }}"
            "step_pack=${{ steps.pack.outcome }}"
            # Nuitka 是主构建；手动选 pyinstaller 时走 pack_fallback（两条都记，一眼看出走的哪条）
            "step_pack_fallback=${{ steps.pack_fallback.outcome }}"
            "step_smoke=${{ steps.smoke.outcome }}"
            "step_check=${{ steps.check.outcome }}"
            "step_zip=${{ steps.zip.outcome }}"
            # 包内容自检（解压看 exe 在不在、有没有注册机）：它 success 才说明"这个 zip 真的能发"
            "step_zipcheck=${{ steps.zipcheck.outcome }}"
            "step_upload=${{ steps.upload.outcome }}"
            # Release 那条路（主下载通道）：它 success 就说明包已经能下载了，
            # 哪怕 step_upload 因额度失败也不影响用户拿包
            "step_release=${{ steps.release.outcome }}"
            # Release 上现在有哪些附件（keygen.exe 由**另一个 job**传，两个 job 的先后不保证；
            # 记下来是为了"注册机到底传上去没有"这件事**不用翻 Actions 页面**就能查）
            "release_assets=${{ steps.release.outcome == 'success' && '见下一步' || '未取' }}"
          ) | Set-Content ci-log/meta.txt
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          # 附件名 + 字节数：主人是私密仓库、看不到 Actions 页面也没法匿名下载，
          # 这三个数字（名字、大小、sha256）就是"这一轮真的产出了一个完整可用的包"的证据。
          $assets = gh release view latest --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) {
            $parsed = $assets | ConvertFrom-Json
            foreach ($a in $parsed.assets) {
              Add-Content ci-log/meta.txt ("release_asset={0} {1} bytes" -f $a.name, $a.size)
            }
          }
          if (Test-Path pyinstaller.log) { Copy-Item pyinstaller.log ci-log/pyinstaller.log -Force }
          if (Test-Path check.log) { Copy-Item check.log ci-log/check.log -Force }
          # 冒烟与包自检的完整输出：私密仓库 + artifact 额度爆的情况下，
          # 这两个文件是"红在哪一步、exe 说了什么、包里有什么"的**唯一**证据来源。
          if (Test-Path smoke.log) { Copy-Item smoke.log ci-log/smoke.log -Force }
          if (Test-Path zipcheck.log) { Copy-Item zipcheck.log ci-log/zipcheck.log -Force }
          # 构建日志只留尾部 200 行（nuitka.log 可能很大，全推会把 ci-log 分支吹起来）
          if (Test-Path nuitka.log) { Get-Content nuitka.log -Tail 200 | Set-Content ci-log/build-tail.log }
          if (Test-Path zip-meta.txt) { Get-Content zip-meta.txt | Add-Content ci-log/meta.txt }
          # 报告文件本身也留一份（exe 的输出在 GUI 子系统下拿不到，这份是它自己写的）
          foreach ($f in @("ci-smoke-data/logs/*.txt", (Join-Path $env:LOCALAPPDATA "LaoATrader/data/logs/*.txt"))) {
            Get-ChildItem $f -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName ci-log/smoke-report.txt -Force }
          }
          Get-Content ci-log/meta.txt
          git add -f ci-log
          git commit -m "CI 结果：${{ job.status }}（run $env:GITHUB_RUN_ID）" --no-verify
          git push -f origin HEAD:ci-log


  # ── 注册机（作者的签发工具）：**独立 job + 独立 artifact**，与主包彻底分开 ──
  #
  # 为什么不并进 build job、也不放进主 artifact：
  #   注册机里带着签发密钥的算法 —— 谁能拿到它，谁就能给任意机器码算出注册码。
  #   主 artifact（LaoniuTrader）是发给用户的，注册机只能作者自己拿，所以两边必须分开。
  #
  # 为什么只在手动触发时跑：
  #   它跟"用户拿到的那一版"没关系，每次 push 都白跑一个 Windows runner 没必要。
  #   想拿注册机：Actions → build-windows → Run workflow（手动触发）→ 跑完下载
  #   artifact `keygen`。作者本地打包同样可以（见 docs/打包教程.md 第八·五节）：
  #   `pyinstaller --noconfirm --clean build\keygen.spec`。
  keygen:
    # 什么时候跑：
    #   ① 主人手动触发（Actions → build-windows → Run workflow）；
    #   ② **改动到注册机相关文件**时（spec / 签发算法 / 这个 workflow 自己）——
    #      这样"注册机该更新了"这件事不用靠人记得去点一下，我也能在推代码后直接验证它。
    # 其余 push 不跑（Windows runner 很贵，注册机跟用户那版没关系）。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'build/keygen.spec') ||
        contains(github.event.head_commit.modified, 'build/keygen.py') ||
        contains(github.event.head_commit.modified, 'src/laoa_trader/licensing.py') ||
        contains(github.event.head_commit.modified, '.github/workflows/build-windows.yml')
      ))
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - id: keygen_pack
        name: PyInstaller 打包注册机
        timeout-minutes: 10
        run: pyinstaller --noconfirm --clean build/keygen.spec

      - id: keygen_check
        name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/keygen.exe")) { throw "没找到 dist/keygen.exe" }
          $size = (Get-Item 'dist/keygen.exe').Length / 1MB
          Write-Host ("注册机大小：{0:N1} MB" -f $size)

      # ── 主下载通道：挂到与主程序同一个滚动 Release ──
      # 为什么不再只靠 artifact（2026-09-21 的教训）：私有仓库的 artifact 存储有硬额度
      # （免费 500MB，主包一封就几百 MB），额度满了**上传必失败** —— 主人手动跑了
      # workflow 也拿不到注册机。Release 附件与那份额度是两回事、链接还固定，
      # 所以从这里下载：Release 页面 → Assets → keygen.exe（与 LaoniuTrader.zip 同一个页面）。
      - id: keygen_release
        name: 把注册机挂到滚动 Release（与主程序同一个页面）
        # ⚠️ 这一步**故意不写 continue-on-error**（与主程序那一步相反）：注册机没有第二个
        # 下载通道，它必须真的传上去。让"这个 job 是绿的"直接等价于"keygen.exe 已在 Release 上"，
        # 看颜色就知道成没成，不用翻日志（2026-09-21 主人手动跑了却拿不到东西，
        # 就是因为原来那一步走 artifact、失败了还被标成"不影响"）。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，先创建一个（主程序那一轮通常会先建好）"
            gh release create $tag --title "老牛选股 · 最新构建" --notes "见 Assets：主程序与注册机"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          # 打成 keygen.zip 再挂：与主程序同一个页面、同一个附件风格（解压即得 keygen.exe），
          # 也避免"裸 exe 被浏览器/杀软拦下"这类下载端的麻烦。
          Compress-Archive -Path 'dist/keygen.exe' -DestinationPath 'keygen.zip' -Force
          gh release upload $tag keygen.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 keygen.zip 到 Release 失败" }
          Write-Host "Release 现有附件："
          gh release view $tag --json assets --jq '.assets[].name'
          Write-Host "::notice::注册机已挂到 Release：https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/keygen.zip"

      - id: keygen_upload
        name: 上传注册机 artifact（额度满了会失败，不影响上面的 Release）
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: keygen
          path: keygen.zip
          retention-days: 2
          if-no-files-found: error

      - name: artifact 没传上去就说清去哪下
        if: steps.keygen_upload.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::注册机没传上 artifact（私有仓库存储额度已满，官方原文：Artifact storage quota has been hit）—— 不影响下载：去 Release 页面取 keygen.zip（与主程序同一个页面）。"

      # 结果同样写回 ci-log：只写 ci-log/keygen-meta.txt（**不动** build job 写的 meta.txt），
      # 并且从远端 ci-log 的状态开始改再推 —— 两个 job 可能同时在写这个分支，
      # 直接 force-push 会把对方那份结果抹掉（这就是为什么下面带重试 + rebase）。
      - name: 记录注册机构建结果到 ci-log 分支
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          @(
            "run=$env:GITHUB_RUN_ID"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "job=$env:GITHUB_JOB"
            "result=${{ job.status }}"
            "step_keygen_pack=${{ steps.keygen_pack.outcome }}"
            "step_keygen_check=${{ steps.keygen_check.outcome }}"
            "step_keygen_release=${{ steps.keygen_release.outcome }}"
            "step_keygen_upload=${{ steps.keygen_upload.outcome }}"
          ) | Set-Content keygen-meta.txt
          # 附件清单：`keygen.zip` 在里面 = 主人真的能下载到（artifact 额度爆了也不影响这条）
          $env:GH_TOKEN = $env:GITHUB_TOKEN
          $assets = gh release view latest --json assets --jq '[.assets[].name] | join(",")' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) { Add-Content keygen-meta.txt "release_assets=$assets" }
          Get-Content keygen-meta.txt
          # 只更新 ci-log/keygen-meta.txt，而且**从远端 ci-log 的现状开始改**再推：
          # build 与 keygen 两个 job 可能同时在写这个分支，各自 force-push 会把对方那份抹掉。
          # 用 FETCH_HEAD（不依赖本地已有分支）+ 多次重试，尽量减少"推送被拒"造成的丢记录。
          $pushed = $false
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin ci-log --depth=1 *> $null
            if ($LASTEXITCODE -ne 0) { Write-Host "拉取 ci-log 失败，重试第 $i 次"; Start-Sleep -Seconds 8; continue }
            git checkout -B ci-log-push FETCH_HEAD *> $null
            New-Item -ItemType Directory -Force -Path ci-log | Out-Null
            Copy-Item keygen-meta.txt ci-log/keygen-meta.txt -Force
            git add -f ci-log
            git commit -m "注册机结果：${{ job.status }}（run $env:GITHUB_RUN_ID）" --no-verify *> $null
            git push origin HEAD:ci-log
            if ($LASTEXITCODE -eq 0) { $pushed = $true; Write-Host "已写入 ci-log/keygen-meta.txt"; break }
            Write-Host "推送被拒（另一个 job 也在写 ci-log），第 $i 次重试"
            Start-Sleep -Seconds 8
          }
          if (-not $pushed) { Write-Host "::warning::没能把注册机结果写回 ci-log（不影响 keygen.exe 本身）" }
