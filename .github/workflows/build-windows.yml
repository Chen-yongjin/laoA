# 在 GitHub 的 Windows 运行器上自动打包「老A法师 · 交易终端」
#
# 用法（你本机不需要装 Python）：
#   1. 代码推到 main 后会自动构建；也可以在 Actions 页面点 "Run workflow" 手动触发
#   2. 构建完成后，在该次运行的页面底部 Artifacts 里下载 LaoATrader-Windows
#   3. 解压后双击 LaoATrader.exe 即可（首次运行会走数据自检 → 下载向导）
#
# 说明：
# - 测试不过就不出包（pytest 失败即整轮失败），避免把坏版本发出去
# - 产物是 onedir 目录版（启动快、杀软误报少），压缩后通常 200~400MB
name: build-windows

on:
  workflow_dispatch:          # 手动触发（推荐：想发包时点一下）
  push:
    branches: [main]
    paths-ignore:             # 只改文档就不必跑构建，省额度
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"                       # Windows 上避免中文路径/日志乱码

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑测试（不通过就不出包）
        run: python -m pytest tests -q

      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean build/laoa_trader.spec

      - name: 检查产物
        run: |
          if (-not (Test-Path "dist/LaoATrader/LaoATrader.exe")) { throw "没找到 dist/LaoATrader/LaoATrader.exe" }
          $size = (Get-ChildItem -Recurse dist/LaoATrader | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("产物大小：{0:N1} MB" -f $size)
          # 顺手确认关键依赖真的打进去了（缺了会造成运行期报错）
          foreach ($p in @("pandas", "pyarrow", "PySide6")) {
            if (-not (Get-ChildItem -Recurse dist/LaoATrader -Filter "*$p*" -ErrorAction SilentlyContinue)) {
              Write-Warning "产物里似乎没找到 $p"
            }
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LaoATrader-Windows
          path: dist/LaoATrader/
          retention-days: 14
          compression-level: 6
          if-no-files-found: error

      # 想发版本时打个 tag（如 v0.1.0），这里会自动生成 Release 附件；
      # 产物超过 artifact 上限时用 Release 更稳（单文件上限更宽松）。
      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LaoATrader/LaoATrader.exe
          generate_release_notes: true
